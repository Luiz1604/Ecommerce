    <header>
        <nav class="menu-principal">
            <div class="menu-esquerda">
                <button class="botao-menu-lateral" onclick="abrirMenu()">
                    <span class="material-symbols-outlined">menu</span>
                    <span>Menu</span>
                </button>

                <!--<div class="caixa-pesquisa">
                    <input type="text" placeholder="O que você está procurando?">
                    <button type="submit">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                </div>-->
            </div>

            <div class="logo-centro">
                <a href="#">
                    <img src="imagens/logo.png" alt="Logo da Loja">
                </a>
            </div>

            <ul class="menu-direita">
                <li>
                    <a href="login.html">

                        <span>Minha conta</span>

                <!--<li>

    <!--Cadastro-->
    <main class="main-login">
        <div class="esquerda-login">
            <h1>Entre e encontre a coleção certa<br>para completar o seu estilo.</h1>
            <img src="login-animate.svg" class="esquerda-login-image" alt="login animação">
        </div>

        <div class="direita-login">
            <div class="card-login">
                <h2>Login</h2>
                
                <div class="textfield">
                    <label for="usuario">E-mail ou Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu e-mail">
                </div>

                <div class="textfield">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                </div>

                <button class="btn-login">Entrar</button>
            </div>
        </div>
    </main>

</body>
